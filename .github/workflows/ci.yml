name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        env:
          # With CI set, ray lint demands an npm package-lock.json; this repo uses pnpm.
          CI: ""
      - run: pnpm test
      - run: npx tsc --noEmit
      - run: pnpm build
